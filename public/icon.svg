<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#311042"/>
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Card -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="rgba(255, 255, 255, 0.12)" stroke-width="4"/>

  <!-- Glowing Aura -->
  <circle cx="256" cy="256" r="140" fill="#6366f1" opacity="0.25" filter="url(#glow)"/>

  <!-- Compression Vices / Brackets -->
  <!-- Top Compressor Bar -->
  <path d="M 120 130 L 392 130 C 402 130 410 138 410 148 L 410 168 C 410 178 402 186 392 186 L 120 186 C 110 186 102 178 102 168 L 102 148 C 102 138 110 130 120 130 Z" fill="url(#primaryGrad)"/>
  <!-- Top Arrow pointing inward (down) -->
  <polygon points="256,220 220,180 292,180" fill="url(#primaryGrad)"/>

  <!-- Bottom Compressor Bar -->
  <path d="M 120 326 L 392 326 C 402 326 410 334 410 344 L 410 364 C 410 374 402 382 392 382 L 120 382 C 110 382 102 374 102 364 L 102 344 C 102 334 110 326 120 326 Z" fill="url(#primaryGrad)"/>
  <!-- Bottom Arrow pointing inward (up) -->
  <polygon points="256,292 220,332 292,332" fill="url(#primaryGrad)"/>

  <!-- Central Document / Photo Squeezed Core -->
  <rect x="156" y="210" width="200" height="92" rx="18" fill="#1e293b" stroke="rgba(255, 255, 255, 0.25)" stroke-width="3"/>

  <!-- Text / Badge in Center: "KB" -->
  <text x="220" y="272" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-weight="900" font-size="52" fill="#ffffff" letter-spacing="-1">KB</text>
  
  <!-- Mini Spark / Flash next to KB -->
  <polygon points="314,240 324,258 344,260 329,273 334,292 318,280 302,292 307,273 292,260 312,258" fill="#38bdf8" filter="url(#glow)"/>
</svg>
