<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="65%">
      <stop offset="0%" stop-color="#19112d"/>
      <stop offset="55%" stop-color="#0e0c19"/>
      <stop offset="100%" stop-color="#070910"/>
    </radialGradient>

    <!-- Neon Glow Filter -->
    <filter id="neonGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feGaussianBlur stdDeviation="18" result="coloredBlurWide"/>
      <feMerge>
        <feMergeNode in="coloredBlurWide"/>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Deep Ambient Glow -->
    <filter id="ambientGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="35" result="blur"/>
    </filter>

    <!-- Linear Gradients for Strokes -->
    <linearGradient id="purpleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e9d5ff"/>
      <stop offset="30%" stop-color="#c084fc"/>
      <stop offset="70%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>

    <linearGradient id="bracketTopGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f3e8ff"/>
      <stop offset="50%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#9333ea"/>
    </linearGradient>

    <linearGradient id="bracketBottomGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333ea"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#d8b4fe"/>
    </linearGradient>

    <linearGradient id="arrowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#e9d5ff"/>
    </linearGradient>
  </defs>

  <!-- Dark Rounded App Container Background -->
  <rect width="512" height="512" rx="108" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="104" fill="none" stroke="rgba(192, 132, 252, 0.15)" stroke-width="2"/>

  <!-- Ambient Purple Core Glow -->
  <circle cx="256" cy="256" r="140" fill="#a855f7" opacity="0.32" filter="url(#ambientGlow)"/>

  <!-- Top Diamond Bracket -->
  <path d="M 182 220 L 243 154 C 250 146 262 146 269 154 L 330 220" 
        fill="none" 
        stroke="url(#bracketTopGrad)" 
        stroke-width="17" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#neonGlow)"/>

  <!-- Bottom Diamond Bracket -->
  <path d="M 182 292 L 243 358 C 250 366 262 366 269 358 L 330 292" 
        fill="none" 
        stroke="url(#bracketBottomGrad)" 
        stroke-width="17" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#neonGlow)"/>

  <!-- Central Document Icon -->
  <!-- Document Body with top-right fold -->
  <path d="M 218 316 L 294 316 C 301 316 306 311 306 304 L 306 230 L 278 196 L 218 196 C 211 196 206 201 206 208 L 206 304 C 206 311 211 316 218 316 Z" 
        fill="none" 
        stroke="url(#purpleGrad)" 
        stroke-width="14" 
        stroke-linejoin="round"
        filter="url(#neonGlow)"/>

  <!-- Document Folded Corner Flap -->
  <path d="M 276 196 L 276 230 L 306 230" 
        fill="none" 
        stroke="url(#purpleGrad)" 
        stroke-width="14" 
        stroke-linejoin="round" 
        stroke-linecap="round"
        filter="url(#neonGlow)"/>

  <!-- Left Compression Arrow (Pointing Right ->) -->
  <line x1="58" y1="256" x2="142" y2="256" 
        stroke="url(#arrowGrad)" 
        stroke-width="16" 
        stroke-linecap="round"
        filter="url(#neonGlow)"/>
  <path d="M 112 226 L 146 256 L 112 286" 
        fill="none" 
        stroke="url(#arrowGrad)" 
        stroke-width="16" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#neonGlow)"/>

  <!-- Right Compression Arrow (Pointing Left <-) -->
  <line x1="454" y1="256" x2="370" y2="256" 
        stroke="url(#arrowGrad)" 
        stroke-width="16" 
        stroke-linecap="round"
        filter="url(#neonGlow)"/>
  <path d="M 400 226 L 366 256 L 400 286" 
        fill="none" 
        stroke="url(#arrowGrad)" 
        stroke-width="16" 
        stroke-linecap="round" 
        stroke-linejoin="round"
        filter="url(#neonGlow)"/>
</svg>
